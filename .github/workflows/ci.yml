name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy-vps:
    name: Deploy PWA to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    uses: HEINRICK7/backend-tino/.github/workflows/deploy-pwa-vps.yml@main
    with:
      pwa_ref: ${{ github.sha }}
